name: Dashboard checks

on:
  pull_request:
    paths:
      - "dashboard/**"
      - "repositories/catalog.yml"
      - ".github/workflows/dashboard-check.yml"
      - ".github/workflows/deploy-dashboard.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Prepare dashboard config
        run: >-
          python src/prepare_dashboard_config.py
          --config dashboard.yml
          --output .dashboard.runtime.yml

      - name: Validate uncached Actions metrics collection
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -euo pipefail
          python src/collect_action_metrics.py \
            --config .dashboard.runtime.yml \
            --output /tmp/dashboard-action-metrics-validation.json \
            --valid-output .action-metrics-valid
          test "$(cat .action-metrics-valid)" = "true"
