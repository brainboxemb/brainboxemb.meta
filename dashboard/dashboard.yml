dashboard:
  title: brainboxemb GitHub Actions Dashboard
  subtitle: Current workflow status on the default branch
  owner: brainboxemb
  repository: brainboxemb.meta
  refresh_workflow: deploy-dashboard.yml
  settings_workflow: configure-repositories.yml
  # Repository settings changes use DASHBOARD_ADMIN_TOKEN.
  hide_repositories_without_workflows: false
  separate_repositories_without_workflows: true
  repositories_without_workflows_group: Repositories without Actions
  show_disabled_workflows: false
  hide_reusable_only_workflows: true
  show_latest_tag: true
  show_open_pull_requests: true
  show_branch_cleanup: true
  branch_cleanup_ignore_branches:
    - build
    - verification
    - dev/build
    - dev/verification
    - prod/build
    - prod/verification
    - rel/*
    - gh-pages
  show_branch_auto_delete: true
  show_default_branch_protection: true
  action_metrics_days: 30
  stale_after_hours: 168

# Canonical public repository membership and grouping now lives here.
catalog: repositories/catalog.yml

workflow_labels:
  pages-build-deployment: Pages
  render-openscad: Render OpenSCAD
  render_openscad_pngs: Render OpenSCAD
  export-openscad-stls: Export STL
  export_openscad_stls: Export STL
  verification: Verification
  verify: Verification
  test: Tests
  tests: Tests
  build: Build
  deploy: Deploy
  release: Release
