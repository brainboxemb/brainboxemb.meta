schema_version: 1

# Canonical catalog of public brainboxemb repositories.
# Stable classification belongs here; live GitHub state does not.
# The dashboard consumes dashboard_group only as presentation grouping.

repositories:
  - repository: brainboxemb/brainboxemb.meta
    category: coordination
    domain: cross-project
    lifecycle: current
    dashboard_group: Coordination
    role: Portfolio-level coordination, architecture, migration planning, repository overview, and dashboard.

  - repository: brainboxemb/brainboxemb.github.actions
    category: tooling
    domain: scad
    lifecycle: classic
    dashboard_group: Tooling
    role: Shared OpenSCAD GitHub Actions and support scripts used by the earlier CAD-project generation.
    engines:
      - openscad

  - repository: brainboxemb/docker.scad-toolchain
    category: tooling
    domain: scad
    lifecycle: current
    dashboard_group: Tooling
    role: Shared SCAD runtime and build container.
    engines:
      - openscad
      - pythonscad

  - repository: brainboxemb/docker.scad-toolchain.test
    category: tooling
    domain: scad
    lifecycle: current
    dashboard_group: Tooling
    role: Consumer-style verification of the SCAD runtime/toolchain.
    engines:
      - openscad
      - pythonscad

  - repository: brainboxemb/tool.git-project
    category: tooling
    domain: repository
    lifecycle: current
    dashboard_group: Tooling
    role: Generic Git project bootstrap, pinned dependency, submodule, Moon orchestration, and generated-output support.

  - repository: brainboxemb/tool.scad-project
    category: tooling
    domain: scad
    lifecycle: current
    dashboard_group: Tooling
    role: Reusable SCAD project CLI, build/design/verification policy, and GitHub Actions workflows.
    engines:
      - openscad
      - pythonscad

  - repository: brainboxemb/template.scad-project
    category: template
    domain: scad
    lifecycle: current
    dashboard_group: Tooling
    role: Reference consumer and starting point for structured SCAD projects.
    engines:
      - openscad
      - pythonscad
    project_infrastructure:
      generation: current
      provider: tool.scad-project

  - repository: brainboxemb/tool.java-project
    category: tooling
    domain: java
    lifecycle: current
